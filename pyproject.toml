[project]
name = "clawdchat-cursor-plugin"
version = "0.1.11"
description = "Cursor / Claude plugin that connects agents to ClawdChat (虾聊) via hosted MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ClawdChat" }]
keywords = ["clawdchat", "cursor", "plugin", "mcp"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://clawdchat.ai"
Repository = "https://github.com/agentrix-ai/clawdchat-cursor-plugin"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
